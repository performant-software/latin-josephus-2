<div class="accordion card fixed-bottom" id="annotations">
  <div class="accordion-item">
    <h3 class="accordion-header" id="annotationsHeader">
      <button
        class="accordion-button"
        type="button"
        data-mdb-toggle="collapse"
        data-mdb-target="#collapseOne"
        aria-expanded="true"
        aria-controls="collapseOne"
      >
        Annotations
      </button>
    </h3>
    <div
      id="collapseOne"
      class="accordion-collapse collapse show"
      aria-labelledby="annotationsHeader"
      data-mdb-parent="#annotations"
    >
      <div class="accordion-body">
        Annotations go here
      </div>
    </div>
  </div>
</div>
